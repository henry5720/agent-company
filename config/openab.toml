[discord]
bot_token = "${DISCORD_BOT_TOKEN}"

# 其餘照 OpenAB 預設：沒有 channel／user 白名單 = 全開，channel 要 @bot 才開 thread，不理其他 bot。
# DM 預設關，這裡要開：接同事 Chrome、Windows 桌面的網址和 key 只在 DM 交付（agents/AGENTS.md）。
allow_dm = true

# 其他 bot 的訊息有 @這個 bot 才處理（OpenAB 預設 off = 全部不理）。讓同事用自己的 agent 透過 discord MCP
# （agent-config 的 docs/mcp/discord.md）發訊息給它。連續 bot 回合受 max_bot_turns（預設 100）節流。
allow_bot_messages = "mentions"

# OpenAB 直接跑 codex-acp。provider、model 與 catalog 在 config/codex/。
# 三個 env 只能從這裡給：[agent].env 在 env_clear() 之後加入、會蓋過 inherit_env；
# OpenAB 不呼叫 session/set_mode，所以初始 mode 只能用 INITIAL_AGENT_MODE。
# - CODEX_HOME：在可寫的 home volume 裡。沒有它 session/load 失敗，OpenAB 會默默開新 session。
# - CODEX_PATH：image 內釘版的 codex（config/versions.env 的 CODEX_VERSION）。
# - agent-full-access：OpenAB 官方對 container 部署的建議（docs/codex.md）。container 內 bwrap
#   建不了 namespace，其他 mode 的 shell 不是失敗就是每條都要人按允許；邊界是 container 本身。
# - CODEX_INTERNAL_ORIGINATOR_OVERRIDE：app-server 預設拿 ACP client 名稱（openab）當 originator，
#   公司 gateway 背後的 ChatGPT 帳號對非 Codex originator 會不定期回 gpt-6.1-sol model_not_found。
#   理由與實測見 docs/adr/0013-send-a-codex-originator-to-the-gateway.md。
# working_dir 照官方用 home；snapshot 在 /home/node/snapshots。
[agent]
command = "codex-acp"
working_dir = "/home/node"
# PLAYWRIGHT_MCP_IDLE_TIMEOUT：`playwright-cli attach` 預設永不 detach，session 收掉後 daemon 被 tini
# 收養、分頁留在 sidecar。設了之後閒置 4 小時（跟 [pool] session_ttl_hours 一樣，每個指令重新計時）
# 自動 detach，並關掉它開的 isolated context。理由見 docs/adr/0016-reclaim-browser-tabs-by-idleness.md。
env = { CODEX_HOME = "/home/node/.codex", CODEX_PATH = "/opt/codex-0.166.0/node_modules/.bin/codex", INITIAL_AGENT_MODE = "agent-full-access", CODEX_INTERNAL_ORIGINATOR_OVERRIDE = "codex_exec", PLAYWRIGHT_MCP_IDLE_TIMEOUT = "14400000" }
inherit_env = [
  "COMPANY_GATEWAY_API_KEY",
  "COMPANY_GATEWAY_BASE_URL",
  # agent-config mcp.yaml 的 context7 用 fromEnv 讀它；沒設時 context7 拿不到 key，其他 MCP 照常。
  "CONTEXT7_API_KEY",
  # agent-config mcp.yaml 的 graphify 用 fromEnv 讀它；沒設時 graphify 連不上，其他 MCP 照常。
  "GRAPHIFY_API_KEY",
  # discord-thread-artifact 用它把檔案傳回原 thread。
  "DISCORD_BOT_TOKEN",
]

# 每次啟動先把 provider、規則、skills 與 MCP 對齊 agent-config snapshot（agents/bin/agent-sync）。
# 失敗就不啟動：少了 provider 設定 Codex 根本打不到 gateway。host 每小時同步完 snapshot 會再跑一次。
[hooks.pre_boot]
inline = '''
#!/bin/sh
exec /usr/local/bin/agent-sync
'''
timeout_seconds = 60
on_failure = "abort"

[filestore]
# Incoming attachments use Cloudflare R2. Credentials stay in the deployment
# host's env/openab.env and are interpolated at runtime; never put their values
# here.
bucket = "work-agent-attachments"
endpoint = "https://99de68928da234ebcf0c9370443ad7ee.r2.cloudflarestorage.com"
region = "auto"
# 預設 250；agents/AGENTS.md 跟使用者講的是 50 MiB。
max_file_size_mb = 50
access_key_id = "${R2_ACCESS_KEY_ID}"
secret_access_key = "${R2_SECRET_ACCESS_KEY}"

# 跟 OpenAB 預設相同，寫明是因為 [agent].env 的 PLAYWRIGHT_MCP_IDLE_TIMEOUT 跟著它（ADR 0016）。
[pool]
max_sessions = 10
session_ttl_hours = 4
