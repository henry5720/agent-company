[slack]
bot_token = "${SLACK_BOT_TOKEN}"
app_token = "${SLACK_APP_TOKEN}"

# Workspace users may drive the bot when Slack delivers the event; channel access
# still depends on the Slack app's actual event visibility and invitations.
allow_all_channels = true
allow_all_users = true
allow_bot_messages = "off"
allow_user_messages = "involved"
assistant_mode = false
streaming = false

# OpenAB 直接跑 codex-acp（spec #21 §4）。provider、model 與 catalog 在 config/codex/。
# 三個 env 只能從這裡給：[agent].env 在 env_clear() 之後加入、會蓋過 inherit_env；
# OpenAB 不呼叫 session/set_mode，所以初始 mode 只能用 INITIAL_AGENT_MODE。
# - CODEX_HOME：named volume。沒有它 session/load 失敗，OpenAB 會默默開新 session。
# - CODEX_PATH：image 內釘版的 codex（config/versions.env 的 CODEX_VERSION）。
# - agent-full-access：container 內 bwrap 建不了 namespace，其他 mode 的 shell 不是失敗就是
#   每條都要人按允許。可寫範圍交給 Docker mount 決定。
# gateway key 不在這裡也不在 container：host proxy 注入（config/caddy/Caddyfile）。
[agent]
command = "codex-acp"
working_dir = "/home/node/code"
env = { CODEX_HOME = "/home/node/.codex", CODEX_PATH = "/opt/codex-0.159.0/node_modules/.bin/codex", INITIAL_AGENT_MODE = "agent-full-access" }
inherit_env = [
  "COMPANY_GATEWAY_BASE_URL",
  "SLACK_BOT_TOKEN",
  "SLACK_LIST_ID",
  "SLACK_TEAM_ID",
  "SLACK_WORKSPACE_URL",
  "WORK_HELPER_ISSUE_MODE",
]

# 音檔只會在部署維護者確認另一個 OpenAI-compatible STT endpoint 後才啟用。公司
# gateway 不因此被假定支援 STT；未啟用時 OpenAB 不轉錄，bot 必須明確回覆 audio 不支援。
# endpoint 是 STT_BASE_URL + /audio/transcriptions，詳見 OpenAB 的 [stt] 文件。
[stt]
enabled = false
api_key = "${STT_API_KEY}"
base_url = "${STT_BASE_URL}"
model = "whisper-large-v3-turbo"
echo_transcript = false

[filestore]
# Incoming attachments use Cloudflare R2. Credentials stay in the deployment
# host's env/openab.env and are interpolated at runtime; never put their values
# here.
bucket = "work-agent-attachments"
endpoint = "https://99de68928da234ebcf0c9370443ad7ee.r2.cloudflarestorage.com"
region = "auto"
prefix = "incoming/"
presigned_ttl = 3600
max_file_size_mb = 50
access_key_id = "${R2_ACCESS_KEY_ID}"
secret_access_key = "${R2_SECRET_ACCESS_KEY}"

[pool]
max_sessions = 10
session_ttl_hours = 4

[reactions]
enabled = true
remove_after_reply = true
tool_display = "compact"
