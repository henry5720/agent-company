name: agent-company

# 這份檔案可直接由 `docker compose` 使用。image 與 build args 對應
# config/versions.env 的 checked-in pins；不要改成 floating tag。
#
# 形狀照 OpenAB 官方 k8s 部署：一個 container 跑 OpenAB 與 agent，/home/node 是持久、可寫的
# home（官方用 PVC，這裡用 named volume）。跟官方不同的是唯讀的 snapshot，以及 `chrome`
# sidecar（官方 docs/sidecar.md 的模式：跟 agent 共用 localhost）。
services:
  # 只持有網路的 container，等於 k8s pod 的 pause container。agent 與 chrome 都加入它的網路：
  # 任一邊重啟都不會換掉對方的 localhost。直接讓 chrome 加入 agent 的網路的話，agent 一重啟
  # chrome 就留在舊的 network namespace，127.0.0.1:9222 從此連不到。
  net:
    image: registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENAB_IMAGE: ghcr.io/openabdev/openab:0.10.0-beta.3-codex@sha256:b1a47eaeddb99cffef4ce50f3791cee9830043ef3a573c598a559ac913dff7e8
        CODEX_VERSION: 0.159.0
        CODEX_ACP_VERSION: 2.0.0
        CODEGRAPH_VERSION: 1.5.0
        SKILLSHARE_VERSION: 0.25.12
        PLAYWRIGHT_CLI_VERSION: 0.1.22
        SKILLSHARE_LINUX_AMD64_SHA256: 4a9674711bfd6acc360fc61af52c8b729693ccb75032160b53d8a018c051e800
        SKILLSHARE_LINUX_ARM64_SHA256: 2af03f7cff56548ffadfd5fbc3bd407139bf73248cff5a2769d48e52647a1442
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: agent-company:0.10.0-codex
    container_name: agent-company
    network_mode: service:net
    depends_on:
      - net
    restart: unless-stopped
    env_file:
      - path: env/openab.env
        required: false
    environment:
      CODEGRAPH_TELEMETRY: "0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # agent 會在這裡 install、跑 dev server；上限讓它跑爆時只殺自己，不拖垮 host。
    cpus: 6.0
    mem_limit: 8g
    pids_limit: 1024
    stop_grace_period: 30s
    # `z` relabels bind mounts for SELinux hosts and is a no-op elsewhere.
    volumes:
      # OpenAB 唯一 runtime config。
      - ./config/openab.toml:/etc/openab/config.toml:ro,z
      # 整個 home 可寫：CODEX_HOME、OpenAB state、agent 自己 clone 的 repo 與安裝的工具都在這。
      # 下面幾個唯讀 mount 比較深，Compose 會疊在這個 volume 之上。
      - home:/home/node
      # agent-sync（OpenAB pre_boot hook）用這三個檔產生 ~/.codex/config.toml 與 ~/.codex/AGENTS.md，
      # 並讓 skillshare 裝 skills 與 MCP。provider 由 deploy.sh 從 config/codex/config.toml 產生。
      - ./runtime/codex/config.toml:/etc/codex/config.toml:ro,z
      - ./agents/AGENTS.md:/etc/codex/AGENTS.bot.md:ro,z
      - ./config/skillshare/config.yaml:/home/node/.config/skillshare/config.yaml:ro,z
      - ./config/codex/catalog.json:/etc/codex/catalog.json:ro,z
      # One mount for the whole snapshot root: adding a repo only touches
      # config/repos.conf. skills、MCP 與個人規則都從其中的 agent-config 來（agent-sync）。
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}:/home/node/snapshots:ro,z
      # CodeGraph indexes are SQLite in WAL mode, so they need a writable path.
      # Each snapshot's .codegraph is a relative symlink into this one directory,
      # which keeps repo source read-only and adding a repo free of Compose edits.
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}/.index:/home/node/snapshots/.index:z

  # headless Chrome sidecar。透過 `net` 跟 agent 共用 localhost：agent 連 127.0.0.1:9222
  # 就是它（跟維護者機器的 chrome-devtools MCP 同一個 --browser-url），它也開得到 agent 跑起來的
  # dev server。沒有 token、沒有 volume。entrypoint 直接跑 Chrome、只聽 127.0.0.1，不用 image
  # 自帶那個聽所有介面的 socat。
  chrome:
    image: chromedp/headless-shell:157.0.8103.27@sha256:7bee201478b2f6266aae01243740ee85c16281e32f42d3aed9fdf04f4eace7a1
    network_mode: service:net
    depends_on:
      - net
    restart: unless-stopped
    entrypoint:
      - /headless-shell/headless-shell
      - --no-sandbox
      - --use-gl=angle
      - --use-angle=swiftshader
      - --remote-debugging-address=127.0.0.1
      - --remote-debugging-port=9222
      - --user-data-dir=/tmp/chrome
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512
    shm_size: 1g
    tmpfs:
      - /tmp:size=1g,mode=1777

volumes:
  home:
