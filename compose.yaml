name: work-agent

# 這份檔案可直接由 `docker compose` 使用。image 與 build args 對應
# config/versions.env 的 checked-in pins；不要改成 floating tag。
services:
  backlog-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENAB_IMAGE: ghcr.io/openabdev/openab:0.10.0-beta.3-codex@sha256:b1a47eaeddb99cffef4ce50f3791cee9830043ef3a573c598a559ac913dff7e8
        CODEX_VERSION: 0.159.0
        CODEX_ACP_VERSION: 2.0.0
        CODEGRAPH_VERSION: 1.5.0
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    # tag 跟舊的 :0.10.0-opencode 不同，切換時舊 image 不會被這次 build 蓋掉（spec #21 §12）。
    image: work-agent-openab:0.10.0-codex
    container_name: work-agent
    restart: unless-stopped
    env_file:
      - path: env/openab.env
        required: false
    environment:
      CODEGRAPH_TELEMETRY: "0"
      # host Caddy proxy（config/host-network.env 的 WORK_AGENT_GATEWAY_IP:WORK_AGENT_PROXY_PORT）。
      # 寫在這裡會蓋過 env_file；gateway key 只在 proxy，這個 container 沒有 COMPANY_GATEWAY_API_KEY。
      COMPANY_GATEWAY_BASE_URL: http://10.231.0.1:18080
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # spec #21 §8：bot 讓出資源給 2 格 prototype sandbox。
    cpus: 4.0
    mem_limit: 6g
    pids_limit: 1024
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=1g,mode=1777
    # 防火牆只認 10.231.0.10 是 bot、只有它連得到 host proxy（config/host-network.env）。
    networks:
      work-agent-net:
        ipv4_address: 10.231.0.10
    # `z` relabels bind mounts for SELinux hosts and is a no-op elsewhere.
    volumes:
      # OpenAB 唯一 runtime config。
      - ./config/openab.toml:/etc/openab/config.toml:ro,z
      # CODEX_HOME 必須是 named volume：session rollout 存在 sessions/ 底下，沒有它
      # session/load 失敗，OpenAB 會直接開新 session、不告訴使用者。Codex 設定以單檔唯讀
      # 疊在上面（Compose 依 target 深度掛載，父層 volume 先 bind），agent 改不掉 provider。
      - codex-home:/home/node/.codex
      - ./config/codex/config.toml:/home/node/.codex/config.toml:ro,z
      # agent 規則只有 agents/CLAUDE.md 一份；Codex 把 $CODEX_HOME/AGENTS.md 當全域指示讀。
      - ./agents/CLAUDE.md:/home/node/.codex/AGENTS.md:ro,z
      # model catalog 放在 volume 外，升級 codex 重產時不用動 volume。
      - ./config/codex/catalog.json:/etc/codex/catalog.json:ro,z
      - ./runtime/openab:/home/node/.openab:z
      - ./runtime/drafts:/home/node/drafts:z
      # One mount for the whole snapshot root: adding a repo only touches
      # config/repos.conf. Skills come from the agent-config snapshot, read-only:
      # 可寫的 skill 目錄會讓被 injection 的 thread 植入跨 PM 持續的 skill。
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}:/home/node/code:ro,z
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}/agent-config/skills:/home/node/.agents/skills:ro,z
      # CodeGraph indexes are SQLite in WAL mode, so they need a writable path.
      # Each snapshot's .codegraph is a relative symlink into this one directory,
      # which keeps repo source read-only and adding a repo free of Compose edits.
      - ${SNAPSHOT_ROOT:?set SNAPSHOT_ROOT in .env}/.index:/home/node/code/.index:z

# 由 scripts/install-host-network.sh 建立；external 讓 `docker compose down` 不會拿掉它。
networks:
  work-agent-net:
    external: true

# 舊 runtime 的 volume（work-agent_opencode-*、work-agent_claude-credentials）刻意不再宣告：
# 不宣告就不會被 `docker compose down -v` 刪掉，回滾時舊 image 仍接得上。觀察期結束才刪（#36）。
volumes:
  codex-home:
